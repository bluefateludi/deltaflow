[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsync"
version = "0.1.0"
description = "High-performance incremental JSONL to SQLite synchronization CLI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qsync = "qsync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

